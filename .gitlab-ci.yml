default:
  image: ghcr.io/cirruslabs/flutter:latest
  cache:
    paths:
      - $CI_PROJECT_DIR/.pub-cache/
  before_script:
    - export PUB_CACHE=$CI_PROJECT_DIR/.pub-cache
    - export PATH="$PATH":"$PUB_CACHE/bin"
    - flutter --version
    - flutter pub get

stages:
  - test

lint:
  stage: test
  script:
    - dart format --output=none --set-exit-if-changed .
    - dart analyze

test:
  stage: test
  script:
    - flutter test
