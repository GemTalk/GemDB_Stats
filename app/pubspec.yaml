name: vsd
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.1

environment:
  sdk: ^3.10.8

dependencies:
  anthropic_sdk_dart: ^3.0.0
  cristalyse: ^1.17.6
  # SigV4 request signing for Bedrock.
  crypto: ^3.0.0
  file_picker: ^10.3.10
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  # Used directly to sign and re-frame Bedrock requests.
  http: ^1.0.0
  intl: ^0.20.2
  macos_ui: ^2.2.2
  mcp_dart: ^2.1.1
  multi_split_view: ^3.6.1
  path: ^1.9.1
  pluto_grid: ^8.1.0
  shadcn_ui: ^0.54.0
  shared_preferences: ^2.5.5
  streamdown: ^0.1.1
  # Opens the AWS SSO approval page during sign-in.
  url_launcher: ^6.3.0
  vsd_core:
    path: ../core
  vsd_mcp:
    path: ../mcp
  web: ^1.1.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
