<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Visualize GemDB statmon statistics.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GemDB Stats">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon: SVG where supported, PNG otherwise -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>GemDB Stats</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Startup screen, shown until Flutter draws its first frame. Colors match
       the app's light theme so the switch is seamless. */
    html, body { margin: 0; height: 100%; background: #f7f7f7; }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #222;
      text-align: center;
      transition: opacity 200ms ease-out;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading img { width: 88px; height: 88px; }
    #loading h1 { margin: 4px 0 0; font-size: 22px; font-weight: 600; }
    #loading p { margin: 0; max-width: 32em; font-size: 14px; color: #666; }
    #loading .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      font-size: 13px;
      color: #888;
    }
    #loading .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #ddd;
      border-top-color: #c11515;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #loading .spinner { animation-duration: 2.4s; }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <img src="logo.svg" alt="">
    <h1>GemDB Stats</h1>
    <p>Charts and analysis of GemStone/S performance statistics from statmon files.</p>
    <div class="status"><div class="spinner"></div>Loading…</div>
    <noscript><p>GemDB Stats needs JavaScript to run.</p></noscript>
  </div>
  <script>
    // Flutter dispatches this once its first frame is on screen.
    window.addEventListener('flutter-first-frame', () => {
      const loading = document.getElementById('loading');
      loading.classList.add('done');
      loading.addEventListener('transitionend', () => loading.remove());
      // In case the fade never runs (e.g. transitions disabled).
      setTimeout(() => loading.remove(), 1000);
    }, { once: true });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
