name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: core
            tool: dart
          - pkg: mcp
            tool: dart
          - pkg: app
            tool: flutter
    defaults:
      run:
        working-directory: ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: ${{ matrix.tool }} pub get

      - run: dart format --output=none --set-exit-if-changed .

      - run: dart analyze

  test:
    name: test ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: core
            tool: dart
          - pkg: mcp
            tool: dart
          - pkg: app
            tool: flutter
    defaults:
      run:
        working-directory: ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: ${{ matrix.tool }} pub get

      - run: ${{ matrix.tool }} test

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # vsd_core must parse in a browser: no isolates, no dart:io, no Int64List.
      - name: test core in Chrome
        working-directory: core
        run: |
          dart pub get
          dart test -p chrome
          dart test -p chrome -c dart2wasm

      - name: build app for the web
        working-directory: app
        run: |
          flutter pub get
          flutter build web --wasm --no-web-resources-cdn
