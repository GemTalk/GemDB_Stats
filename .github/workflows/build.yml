name: build

on:
  workflow_dispatch:

jobs:
  linux:
    name: build:linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: .github/scripts/build_linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: vsd-${{ steps.vars.outputs.sha_short }}-linux
          path: app/build/linux/x64/release/bundle/
          retention-days: 90
