name: build

on:
  workflow_dispatch:
    inputs:
      linux:
        description: Linux
        type: boolean
        default: true
      windows:
        description: Windows
        type: boolean
        default: true
      macos:
        description: macOS
        type: boolean
        default: true
      web:
        description: Web
        type: boolean
        default: true
  workflow_call:
    inputs:
      linux:
        type: boolean
        default: true
      windows:
        type: boolean
        default: true
      macos:
        type: boolean
        default: true
      web:
        type: boolean
        default: true
      ref:
        description: Commit, branch or tag to build; defaults to the triggering ref
        type: string
        default: ''

jobs:
  linux:
    name: build:linux
    runs-on: ubuntu-22.04
    if: ${{ inputs.linux }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: .github/scripts/build_linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: gemdb-stats-${{ steps.vars.outputs.sha_short }}-linux
          path: app/build/linux/x64/release/bundle/
          retention-days: 90

  windows:
    name: build:windows
    runs-on: windows-latest
    if: ${{ inputs.windows }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - id: vars
        shell: bash
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - shell: pwsh
        run: .github/scripts/build_windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: gemdb-stats-${{ steps.vars.outputs.sha_short }}-windows
          path: app/build/windows/x64/runner/Release/
          retention-days: 90

  macos:
    name: build:macos
    runs-on: macos-latest
    if: ${{ inputs.macos }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: .github/scripts/build_macos.sh
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}

      - uses: actions/upload-artifact@v7
        with:
          name: gemdb-stats-${{ steps.vars.outputs.sha_short }}-macos
          path: app/build/macos/Build/Products/Release/GemDB-Stats.zip
          retention-days: 90

  # The web app as GemDB Code embeds it: JS only (no --wasm), its renderer
  # bundled (--no-web-resources-cdn), and base href "/", which the host
  # rewrites. See docs/embedding.md.
  web:
    name: build:web
    runs-on: ubuntu-latest
    if: ${{ inputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - working-directory: app
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn

      - uses: actions/upload-artifact@v7
        with:
          name: gemdb-stats-${{ steps.vars.outputs.sha_short }}-web
          path: app/build/web/
          retention-days: 90
