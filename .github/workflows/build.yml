name: build

on:
  workflow_dispatch:
    inputs:
      linux:
        description: Linux
        type: boolean
        default: true
      windows:
        description: Windows
        type: boolean
        default: true
      macos:
        description: macOS
        type: boolean
        default: true

jobs:
  linux:
    name: build:linux
    runs-on: ubuntu-22.04
    if: ${{ inputs.linux }}
    steps:
      - uses: actions/checkout@v7

      - id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: .github/scripts/build_linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: vsd-${{ steps.vars.outputs.sha_short }}-linux
          path: app/build/linux/x64/release/bundle/
          retention-days: 90

  windows:
    name: build:windows
    runs-on: windows-latest
    if: ${{ inputs.windows }}
    steps:
      - uses: actions/checkout@v7

      - id: vars
        shell: bash
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - shell: pwsh
        run: .github/scripts/build_windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: vsd-${{ steps.vars.outputs.sha_short }}-windows
          path: app/build/windows/x64/runner/Release/
          retention-days: 90

  macos:
    name: build:macos
    runs-on: macos-latest
    if: ${{ inputs.macos }}
    steps:
      - uses: actions/checkout@v7

      - id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: .github/scripts/build_macos.sh
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}

      - uses: actions/upload-artifact@v7
        with:
          name: vsd-${{ steps.vars.outputs.sha_short }}-macos
          path: app/build/macos/Build/Products/Release/vsd.app.zip
          retention-days: 90
