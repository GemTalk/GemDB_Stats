name: pages

# Publishes the web build of the app to GitHub Pages. Requires Pages to be
# enabled with "GitHub Actions" as its source (Settings → Pages).

on:
  push:
    branches: [main]
    paths:
      - app/**
      - core/**
      - mcp/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The site is served from a subpath (/GemDB_Stats/), which Flutter
      # resolves its assets against.
      - name: build app for the web
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --wasm --no-web-resources-cdn \
            --base-href "${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/build/web

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
